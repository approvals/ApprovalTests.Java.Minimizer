version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: daily
    groups:
      javaparser:
        patterns:
          - "com.github.javaparser:*"
      junit:
        patterns:
          - "org.junit.*"
    commit-message:
      prefix: "- r "
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: ". e "
